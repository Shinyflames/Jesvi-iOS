# Galaxy S20+ LTE (SM-G985F). Measured on the phone 2026-11-21 (docs/devices/y2s/board-facts.md).
# Status stays "unmaintained" for the release tools until they know the darwin layout (no super writes):
# the shared validator requires x1slte's system/log-in-super layout for any other status.
TARGET_NAME="Galaxy S20+ LTE"
TARGET_CODENAME="y2s"
TARGET_STATUS="unmaintained"
TARGET_ASSERT_MODEL="SM-G985F"
TARGET_ASSERT_BOOTLOADER="G985FXXSNHYB1"
TARGET_RECOVERY_PRODUCTS="y2s y2slte"

TARGET_RAM_GB="8"
TARGET_STORAGE_GB="128"
TARGET_DISPLAY_RESOLUTION="1440x3200"
TARGET_DISPLAY_REFRESH_RATES="60,120"
TARGET_DISPLAY_CUTOUT="center"
TARGET_PANEL="s6e3hab"
TARGET_TOUCH="sec_ts"
TARGET_MODEM="lte"
TARGET_WIFI_CHIP="bcm4375"
TARGET_NFC_CHIP="SLSI"
TARGET_FINGERPRINT="ultrasonic"
TARGET_HAS_SPEN="false"
TARGET_HAS_ESIM="true"
TARGET_CAMERA="s20plus"
TARGET_HAPTIC_CHIP="cs40l25"
TARGET_TORCH_CHIP="s2mpb02"
TARGET_SENSORHUB="bcm_sensorhub_a1"

TARGET_BOARD_CONF="common/devices/y2s.conf"
TARGET_FIRMWARE="fw-wifi fw-sound fw-sensors fw-haptic"
# First boot: no board drivers until the log works (M5); touchid stays off (SPI4/USI4 hangs this SoC from Linux).
TARGET_BOOTARGS="ufs_write=1 ufs_darwin_data=1"

TARGET_SUPER_GROUP_NAME="group_basic"
TARGET_SUPER_PARTITION_SIZE="9437184000"
TARGET_SUPER_GROUP_SIZE="9432989696"
