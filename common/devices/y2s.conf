# Samsung Galaxy S20+ LTE (SM-G985F, y2s) -- Exynos 990. Jesvi-iOS port for the y2s, started 2026-11-21.
# Every value below marked "measured" was read from this phone on 2026-11-21 (docs/devices/y2s/board-facts.md).
# Derived from x1slte.conf: same SoC, same 8 GB memory map, same LTE modem layout. The earlier HakiOS
# y2s.conf described an SM-G986B (5G, 12 GB) and is kept as history in devices/exynos990/y2s/legacy/.
NAME="Samsung Galaxy S20+ LTE (y2s, SM-G985F)"
KIND=phone
SOC="Samsung Exynos 990 (S5E9830)"
BOOTLOADER="G985FXXSNHYB1"      # measured (ro.boot.bootloader)

# --- boot chain (Samsung) ---------------------------------------------------------------------------
# This phone dual-boots Android 16 and Ubuntu: TWRP stays in recovery (the rescue path) and every OS
# is a boot image written into `boot` (sda13, 61865984 B, measured). iOS is a third such image:
#   sboot -> boot (BootShim -> Mu-Silicium y2s UEFI -> xnuloader -> XNU)
# Boot header v2, page 2048, board SRPSG12A018KU (measured from the phone's Android boot image).
UEFI_TARGET=y2s
UEFI_FD=
DTB=
FD_BASE=0xE8000000              # "UEFI FD", as x1slte
FD_SIZE=0x200000
PAYLOAD_BASE=0xF0000000         # NOTE: overlaps cp_rmem (0xF0000000, 8 MB) as on x1slte; the modem is not started

# --- kernel and loader ------------------------------------------------------------------------------
FB_BASE=0xF1000000              # measured: reserved-memory framebuffer@f1000000; xnuloader picks platform_y2s by it
WIFI_ATH11K=0                   # Broadcom BCM4375, not a WCN6750
GIC_V2=1                        # GIC-400

# --- memory (8 GB, measured: banks 0x80000000-0xBAAFFFFF, 0xC1200000-0xDFFFFFFF, 0xE1900000-0xFFFFFFFF,
# 0x880000000-0x9FEBFFFFF; identical to x1slte) ------------------------------------------------------
EL2_EARLYMEM=0x9FEC00000        # 20 MB, set by sboot (the bank ends at 0x9FEBFFFFF on this phone)
ABOX_RMEM=0xF8000000            # the audio DSP memsets 0xF8000000-0xFA9FFFFF at every DSP boot
# Carve-outs (measured reserved-memory, all no-map): sec_debug_magic 0x80000000+4K, kaslr 0x80001000+4K,
# secure_camera 0x96000000+50M, el2_code 0xC1400000+2M, s2mpu-table 0xC1800000+3M, seclog 0xC3000000+512K,
# cp_rmem_2 0xD0000000+64M, ramoops 0xEB310000+1M, camera_rmem 0xED210000+1M, teegris 0xED310000+8K,
# cp_rmem 0xF0000000+8M, framebuffer 0xF1000000, abox_pci 0xF4200000+8M, cp_msi 0xF6200000+4K,
# wifi_msi 0xF7200000+4K, sec_rdx_bootdev 0x880000000+173M.

# --- storage: darwin only -------------------------------------------------------------------------
# NEVER super (Android 16 lives there), NEVER userdata (Android's data, sda33), NEVER y2s-root (Linux, sda32).
# darwin: GPT entry 34, LBA 15433216..23821823 of LUN 0, 32 GiB, type APFS, unique
# 6E1A3C5B-2F44-4B8E-9D27-53D2A0F1C934 (measured; made 2026-11-21).
#   blocks 0..2042367        iOS system volume + cryptexes (written from the computer, tools/darwin-write.py)
#   blocks 2042368..8388607  iOS data volume, HFS+ on /private/var (kernel: ufs_write=1 ufs_darwin_data=1)
DARWIN_FIRST=15433216
DARWIN_BLOCKS=8388608
DARWIN_DATA_FIRST=2042368
ROOT_PART=darwin                # the system volume boots from darwin+0 (ufs_root=darwin:0:SIZE)
# The loader's log must also go into darwin, not super's tail (x1slte's SUPER_TAIL_START): TODO M3.

# --- board parts ------------------------------------------------------------------------------------
PANEL=s6e3hab_hubble2           # y2s panel (Linux port: S6E3HAB/Hubble2, 1440x3200; Linux runs 1080x2400@120)
TOUCH="sec_ts y79a (s6sy761)"
WIFI_FW=bcmdhd_sta.bin_b1       # BCM4375 B1, as x1slte
PMIC_GAUGE="MAX77705"

# --- what the run needs -----------------------------------------------------------------------------
BOOTARGS="ufs_write=1 ufs_darwin_data=1"
DEFAULT_SECS=900
USERLAND_VARS="SOFTWARE_PASSCODE=1"
FIRMWARE=""
